# ตั้งค่า SonarQube วิเคราะห์ทั้ง backend (NestJS) และ frontend (React) ในการสแกนเดียว — ดูวิธีรันใน SONARQUBE.md
sonar.projectKey=catering-booking-platform
sonar.projectName=Catering Booking Platform
sonar.sourceEncoding=UTF-8

# monorepo — โฟลเดอร์ backend กับ "Catering Booking Web Application" คนละ tsconfig กัน
sonar.sources=backend/src,Catering Booking Web Application/src
sonar.tests=backend/src,Catering Booking Web Application/src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,backend/prisma/migrations/**,**/*.spec.ts,**/*.test.ts
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,backend/src/**/dto/**,backend/src/**/*.module.ts,backend/src/main.ts,**/*.stories.tsx

sonar.typescript.tsconfigPaths=backend/tsconfig.json,Catering Booking Web Application/tsconfig.json

# lcov จาก pnpm test:cov ของทั้งสองฝั่ง (generate ใหม่ก่อนสแกนทุกครั้ง ไม่ commit ไฟล์นี้เข้า repo)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,Catering Booking Web Application/coverage/lcov.info
