services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catering
      POSTGRES_PASSWORD: catering
      POSTGRES_DB: catering
    ports:
      - '5434:5432'
    volumes:
      - catering_db_data:/var/lib/postgresql/data

volumes:
  catering_db_data:
